---
- name: Enterprise Kubernetes Node Hardening and Storage Prerequisites
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Install required storage and networking packages
      apt:
        name:
          - open-iscsi
          - nfs-common
          - cryptsetup
          - dmsetup
          - chrony
          - curl
          - socat
          - conntrack
          - ipset
        state: present
        update_cache: true

    - name: Enable and start iscsid service for Longhorn CSI
      systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Enable and start chrony for strict time synchronization
      systemd:
        name: chrony
        enabled: true
        state: started

    - name: Disable swap immediately
      command: swapoff -a
      changed_when: false

    - name: Remove swap from /etc/fstab permanently
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Load required kernel modules
      copy:
        dest: /etc/modules-load.d/k8s-enterprise.conf
        content: |
          overlay
          br_netfilter
          iscsi_tcp

    - name: Ensure kernel modules are loaded immediately
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
        - iscsi_tcp

    - name: Configure enterprise sysctl parameters for Kubernetes and Observability
      copy:
        dest: /etc/sysctl.d/99-k8s-enterprise.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
          vm.max_map_count                    = 262144
          fs.inotify.max_user_watches         = 524288
          fs.inotify.max_user_instances       = 512
      notify: Reload sysctl

  handlers:
    - name: Reload sysctl
      command: sysctl --system
