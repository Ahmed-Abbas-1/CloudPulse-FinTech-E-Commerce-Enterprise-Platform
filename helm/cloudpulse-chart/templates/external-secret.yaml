apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudpulse-vault-sync
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cloudpulse-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: cloudpulse/prod
        property: JWT_SECRET
    - secretKey: POSTGRES_USER
      remoteRef:
        key: cloudpulse/prod
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: cloudpulse/prod
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: cloudpulse/prod
        property: POSTGRES_DB
