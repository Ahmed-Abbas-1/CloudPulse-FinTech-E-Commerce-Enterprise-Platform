apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app: order-service
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service
spec:
  replicas: {{ .Values.orderService.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: order-service
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: order-service
          image: "{{ .Values.global.awsAccountId }}.dkr.ecr.{{ .Values.global.awsRegion }}.amazonaws.com/cloudpulse/order-service:{{ .Values.orderService.tag }}"
          ports:
            - containerPort: 8082
          env:
            - name: SERVICE_VERSION
              value: {{ .Values.orderService.versionLabel | quote }}
            - name: DB_HOST
              value: "postgresql"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-app-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-app-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-app-secrets
                  key: POSTGRES_DB
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
