apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudpulse-enterprise-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/Ahmed-Abbas-1/CloudPulse-FinTech-E-Commerce-Enterprise-Platform.git"
    targetRevision: main
    path: helm/cloudpulse-chart
    helm:
      releaseName: cloudpulse
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cloudpulse-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
