apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: enterprise-ip-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.92.200-192.168.92.220
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: enterprise-l2-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - enterprise-ip-pool
