apiVersion: v1
kind: Secret
metadata:
  name: aws-ecr-iam-creds
  namespace: cloudpulse-prod
type: Opaque
stringData:
  AWS_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "624052199701"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-cred-updater
  namespace: cloudpulse-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-manager
  namespace: cloudpulse-prod
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-cred-updater-binding
  namespace: cloudpulse-prod
subjects:
  - kind: ServiceAccount
    name: ecr-cred-updater
    namespace: cloudpulse-prod
roleRef:
  kind: Role
  name: ecr-secret-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-registry-helper
  namespace: cloudpulse-prod
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-cred-updater
          restartPolicy: Never
          containers:
            - name: ecr-token-refresher
              image: amazon/aws-cli:latest
              envFrom:
                - secretRef:
                    name: aws-ecr-iam-creds
              command:
                - /bin/sh
                - -c
                - |
                  ECR_TOKEN=$(aws ecr get-login-password --region ${AWS_REGION})
                  CURL_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  DOCKER_CONFIG_JSON=$(echo -n "{\"auths\":{\"${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com\":{\"username\":\"AWS\",\"password\":\"${ECR_TOKEN}\"}}}" | base64 | tr -d '\n')
                  cat <<EOF > /tmp/secret.json
                  {
                    "apiVersion": "v1",
                    "kind": "Secret",
                    "metadata": {
                      "name": "ecr-registry-secret",
                      "namespace": "cloudpulse-prod"
                    },
                    "type": "kubernetes.io/dockerconfigjson",
                    "data": {
                      ".dockerconfigjson": "${DOCKER_CONFIG_JSON}"
                    }
                  }
                  EOF
                  curl -sS --cacert ${CURL_CA} -H "Authorization: Bearer ${K8S_TOKEN}" -H "Content-Type: application/json" -X DELETE https://kubernetes.default.svc/api/v1/namespaces/cloudpulse-prod/secrets/ecr-registry-secret || true
                  curl -sS --cacert ${CURL_CA} -H "Authorization: Bearer ${K8S_TOKEN}" -H "Content-Type: application/json" -X POST https://kubernetes.default.svc/api/v1/namespaces/cloudpulse-prod/secrets -d @/tmp/secret.json
