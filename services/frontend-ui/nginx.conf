server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 '{"status":"healthy","service":"frontend-ui"}';
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
